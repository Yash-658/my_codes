<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Expense Tracker </title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main">
        <div id="heading_div">
            <h1 id="heading"> Expense Tracker </h1>
        </div>

        <div id="balanceScreen">
            <h3> Your Balance </h3>
            <h1 id="balance"> $0.00 </h1>
            <div id="group">
                <div id="incomeBox">
                    <h3> Income </h3>
                    <h2 id="income"> $0.00 </h2>
                </div>

                <div id="expensesBox">
                    <h3> Expenses </h3>
                    <h2 id="expenses"> $0.00 </h2>
                </div>
            </div>
        </div>

        <div id="transactionBox">
            <div id="transactions">
                <h3> Transactions </h3>
                <div id="transaction_list">
                    <div>
                        <p> Paycheck </p> 
                        <p> $1200 </p> 
                    </div>

                    <div>
                        <p> Paycheck </p> 
                        <p> $1200 </p> 
                    </div>

                    <div>
                        <p> Paycheck </p> 
                        <p> $1200 </p> 
                    </div>

                    <div>
                        <p> Paycheck </p> 
                        <p> $1200 </p> 
                    </div>

                    <div>
                        <p> Paycheck </p> 
                        <p> $1200 </p> 
                    </div>

                    <div>
                        <p> Paycheck </p> 
                        <p> $1200 </p> 
                    </div>

                    <div>
                        <p> Paycheck </p> 
                        <p> $1200 </p> 
                    </div>

                    <div>
                        <p> Paycheck </p> 
                        <p> $1200 </p> 
                    </div>

                    <div>
                        <p> Paycheck </p> 
                        <p> $1200 </p> 
                    </div>
                </div>
            </div>
            

            <div id="addTransactions">
                <div>
                    <h3> Add Transactions </h3>
                    <label for="description"> Description </label>
                    <input type="text" id="description" placeholder="Enter description...">

                    <label for="amount"> Amount </label>
                    <input type="number" id="amount" placeholder="Enter description...">
                    <p> Use negative(-) for expenses </p>
                </div>

                <button> Add Transaction </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
