<!-- Semantic tags keeps your content organised, imporoves SOE, readability etc, semantic tags tell what the content is. 
🔹 Page Structure
<header> – Introductory content (logo, title, nav).
<nav> – Main navigation links.
<main> – Primary content of the document (only one).
<footer> – Footer info (copyright, links, author).

🔹 Content Grouping
<section> – Thematic grouping of content with a heading.
<article> – Standalone, reusable content (blog post, news).
<aside> – Related but secondary content (sidebar, ads).
    
we can use @media queries to make the site responsive to different screen sizes -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halwa</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div id="container">
        <div class = box id="box1">1</div>
        <div class = box id="box2">2</div>
        <div class = box id="box3">3</div>
        <div class = box id="box4">4</div>
    </div>
</body>
</html>
