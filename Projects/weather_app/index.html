<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <inline>
        <input id='input' placeholder="Enter City Name">
        <button onclick='fetchData()'> Submit </button>
    </inline>
    <br><br>
    <main>
        <h1 id='cityName'> Dallas </h1>
        <h1 id='temp'> 30°C </h1>
        <h3 id='humidity'> Humidity: 70%</h3>
        <h3 id='description'> clear sky </h3>
        <h1 id='emoji'>☀️</h1>
    </main>
    <script src="script.js"></script>
</body>
</html>
