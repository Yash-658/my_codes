<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img id="quizImage" src="quiz show-bro.svg" alt="quiz show">
    <div id="intro_screen" class="screen">
        <h1> Quiz Time! </h1>
        <p> Test your knowledge with these fun science questions </p>
        <button onClick='start()'>Start Quiz</button>
    </div>

    <div id="question_screen" class="screen">
        <h2 id="question"> What is the capital of France? </h2>
        <inline id="info_tab">
            <p id="q_number"> Question _ of _ </p>
            <p id="curr_score"> Score: _ </p>
        </inline>

        <div id="options">
            <button id="option1" onclick='getAnswer(1)'>option1</button>
            <button id="option2" onclick='getAnswer(2)'>option2</button>
            <button id="option3" onclick='getAnswer(3)'>option3</button>
            <button id="option4" onclick='getAnswer(4)'>option4</button>
        </div>
        <div id="progress_bar">
            <div id="progress"></div>
        </div>
    </div>

    <div id="result_screen" class="screen">
        <h1> Quiz Results </h1>
        <div>
            <p id="scores"> You scored _ out of _ </p>
            <h2 id="feedback"> Good efforts! Keep learning! </h2>
        </div>
        <button onClick="restart()">Restart Quiz</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
