<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp-Conversion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <h1> Temperature Conversion: </h1>
        <input id="input" type="number">
        <div>
            <br>
            <input type="radio" id="cel_to_far" name="type"></radio>
            <label for="cel_to_far"> Celsius to fahrenheit</label>
            <br>
            <input type="radio" id="far_to_cel" name="type"></radio>
            <label for="far_to_cel">Fahrenheit to celsius</label>
        </div>
        <br>
        <button id="submit">Submit</button>
        <p id="result"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
